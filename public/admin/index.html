<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Bistro Burger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800&family=Geologica:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Écran de connexion (plein écran, sans sidebar) -->
  <div class="login-screen" id="login-screen">
    <section id="login-view" class="login-card">
      <div class="login-logo">Bistro Burger</div>
      <h1>Espace admin</h1>
      <p class="login-sub">Connectez-vous pour gérer le contenu du site.</p>

      <form id="login-form" autocomplete="on">
        <label class="field-label" for="email">E-mail</label>
        <input class="field" type="email" id="email" name="email" required autocomplete="username" placeholder="vous@exemple.com">

        <label class="field-label" for="password">Mot de passe</label>
        <div class="field-with-toggle">
          <input class="field" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="field-toggle" data-toggle-for="password" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <button type="submit" class="btn-primary" id="login-submit">Se connecter</button>

        <div id="login-error" class="login-error" hidden></div>
      </form>
    </section>
  </div>

  <!-- Application (sidebar + contenu), visible une fois connecté -->
  <div class="app-shell" id="app-shell" hidden>

    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <span class="sidebar-logo">
            <img src="../assets/logo-cream-sm.png" alt="Bistro Burger" class="sidebar-logo-img">
          </span>
        </div>
        <button type="button" class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Réduire le menu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
        </button>
      </div>

      <div class="sidebar-group-label">Menu</div>
      <nav class="sidebar-nav">
        <button type="button" class="sidebar-link is-active" id="nav-dashboard" data-nav="dashboard">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
          </span>
          <span class="sidebar-link-text">Accueil</span>
        </button>
      </nav>

      <div class="sidebar-group-label">Gestion du site</div>
      <nav class="sidebar-nav">
        <button type="button" class="sidebar-link" id="nav-burgers" data-nav="burgers">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9c0-3 3.5-5 8-5s8 2 8 5"></path><line x1="4" y1="12" x2="20" y2="12"></line><path d="M3 15h18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
          </span>
          <span class="sidebar-link-text">Les burgers</span>
        </button>
        <button type="button" class="sidebar-link" id="nav-carte" data-nav="carte">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </span>
          <span class="sidebar-link-text">La carte</span>
        </button>
        <button type="button" class="sidebar-link" id="nav-platdujour" data-nav="platdujour">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </span>
          <span class="sidebar-link-text">Plat du jour</span>
        </button>
        <button type="button" class="sidebar-link" id="nav-offres" data-nav="offres">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
          </span>
          <span class="sidebar-link-text">Offres</span>
        </button>
        <button type="button" class="sidebar-link" id="nav-reservations" data-nav="reservations">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </span>
          <span class="sidebar-link-text">Réservations</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-group-label">Général</div>
      <nav class="sidebar-nav sidebar-footer">
        <button type="button" class="sidebar-link" id="logout-btn">
          <span class="sidebar-link-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </span>
          <span class="sidebar-link-text">Se déconnecter</span>
        </button>
      </nav>
    </aside>

    <div class="app-col">
      <header class="app-topbar">
        <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <div class="app-topbar-title" id="page-title">Accueil</div>
        <div class="app-topbar-user">
          <span class="avatar-circle" id="user-avatar"></span>
          <span class="app-topbar-email" id="user-email"></span>
        </div>
      </header>

      <main class="app-main">

        <section id="dashboard-view" class="page-view">
          <div class="hero-card">
            <div class="hero-card-eyebrow">Espace admin</div>
            <h1>Bonjour <span id="dashboard-firstname"></span> 👋</h1>
            <p>Gérez le contenu du site Bistro Burger directement depuis cette page — les changements sont publiés automatiquement.</p>
          </div>

          <h2 class="section-title">Sections</h2>
          <div class="section-grid">
            <button type="button" class="section-card" id="nav-burgers-card" style="background-image:url('../assets/hero-burger.webp')">
              <span class="section-card-top">
                <span class="section-card-tag">Menu</span>
                <span class="section-card-chip">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9c0-3 3.5-5 8-5s8 2 8 5"></path><line x1="4" y1="12" x2="20" y2="12"></line><path d="M3 15h18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg>
                </span>
              </span>
              <span class="section-card-bottom">
                <span class="section-card-label">Les burgers</span>
                <span class="section-card-sub">Ajouter, modifier, réorganiser</span>
                <span class="section-card-btn">Modifier</span>
              </span>
            </button>
            <button type="button" class="section-card" id="nav-carte-card" style="background-image:url('../assets/carte-fond.png')">
              <span class="section-card-top">
                <span class="section-card-tag">Carte complète</span>
                <span class="section-card-chip">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                </span>
              </span>
              <span class="section-card-bottom">
                <span class="section-card-label">La carte</span>
                <span class="section-card-sub">Catégories, plats, prix</span>
                <span class="section-card-btn">Modifier</span>
              </span>
            </button>
            <button type="button" class="section-card" id="nav-platdujour-card" style="background-image:url('../assets/bande-4.webp')">
              <span class="section-card-top">
                <span class="section-card-tag">Aujourd'hui</span>
                <span class="section-card-chip">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </span>
              </span>
              <span class="section-card-bottom">
                <span class="section-card-label">Plat du jour</span>
                <span class="section-card-sub">Plat et suggestion</span>
                <span class="section-card-btn">Modifier</span>
              </span>
            </button>
            <button type="button" class="section-card" id="nav-offres-card" style="background-image:url('../assets/menu-etudiant.png')">
              <span class="section-card-top">
                <span class="section-card-tag">Promotions</span>
                <span class="section-card-chip">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                </span>
              </span>
              <span class="section-card-bottom">
                <span class="section-card-label">Offres</span>
                <span class="section-card-sub">Ajouter, modifier, réorganiser</span>
                <span class="section-card-btn">Modifier</span>
              </span>
            </button>
            <button type="button" class="section-card" id="nav-reservations-card" style="background-image:url('../assets/table-reservee.jpg')">
              <span class="section-card-top">
                <span class="section-card-tag">Réserver</span>
                <span class="section-card-chip">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </span>
              </span>
              <span class="section-card-bottom">
                <span class="section-card-label">Réservations</span>
                <span class="section-card-sub">Créneaux, horaires, couverts</span>
                <span class="section-card-btn">Modifier</span>
              </span>
            </button>
          </div>

          <div class="profile-card">
            <div class="profile-row">
              <span class="profile-avatar" id="profile-avatar"></span>
              <div class="profile-meta">
                <div class="profile-name" id="profile-name"></div>
                <div class="profile-email" id="profile-email"></div>
              </div>
            </div>
            <hr class="divider">
            <button type="button" class="back-btn" id="toggle-password-form">Changer mon mot de passe</button>
            <form id="password-form" hidden>
              <label class="field-label" for="new-password">Nouveau mot de passe</label>
              <div class="field-with-toggle">
                <input class="field" type="password" id="new-password" name="new-password" required autocomplete="new-password" placeholder="Au moins 8 caractères" minlength="8">
                <button type="button" class="field-toggle" data-toggle-for="new-password" aria-label="Afficher le mot de passe">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>

              <button type="submit" class="btn-primary" id="password-submit">Enregistrer le mot de passe</button>

              <div id="password-success" class="password-success" hidden>Mot de passe enregistré.</div>
              <div id="password-error" class="login-error" hidden></div>
            </form>
          </div>
        </section>

        <section id="burgers-view" class="page-view editor-card" hidden></section>
        <section id="carte-view" class="page-view editor-card" hidden></section>
        <section id="platdujour-view" class="page-view editor-card" hidden></section>
        <section id="offres-view" class="page-view editor-card" hidden></section>
        <section id="reservations-view" class="page-view editor-card" hidden></section>

      </main>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.generated.js"></script>
  <script src="admin.js"></script>
  <script src="burgers.js"></script>
  <script src="carte.js"></script>
  <script src="platdujour.js"></script>
  <script src="offres.js"></script>
  <script src="reservations.js"></script>
</body>
</html>
